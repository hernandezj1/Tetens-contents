<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter Viewer</title>
</head>
<body>

<!-- Dropdown to select chapter -->
<select id="chapterSelector">
    <option value="">-- choose chapter --</option>
    <option value="12_PV_ToC_presdocx.html">Table of Contents</option>
    <option value="11_PV_Vorrede_presdocx.html">Vorrede</option>
    <option value="13_PV_Versuch_I_presdocx.html">Chapter I</option>
    <option value="14_PV_Versuch_II_presdocx.html">Chapter II</option>
    <option value="15_PV_Versuch_III_presdocx.html">Chapter III</option>
    <option value="16_PV_Versuch_IV_presdocx.html">Chapter IV</option>
    <option value="17_PV_Versuch_V_presdocx.html">Chapter V</option>
    <option value="18_PV_Versuch_VI_presdocx.html">Chapter VI</option>
    <option value="19_PV_Versuch_VII_presdocx.html">Chapter VII</option>
    <option value="20_PV_Versuch_VIII_presdocx.html">Chapter VIII</option>
    <option value="21_PV_Versuch_IX_presdocx.html">Chapter IX</option>
    <option value="22_PV_Versuch_X_presdocx.html">Chapter X</option>
    <option value="23_PV_Versuch_XI_presdocx.html">Chapter XI</option>
</select>

<!-- Iframe to display selected chapter -->
<iframe id="chapterFrame" src="" style="width:100%; height:calc(100vh - 40px); border:none;"></iframe>

<script>
const selector = document.getElementById("chapterSelector");
const iframe = document.getElementById("chapterFrame");

selector.addEventListener("change", (e) => {
    const filename = e.target.value;
    if (filename) {
        iframe.src = `chapter_files/${filename}`;
    } else {
        iframe.src = "";
    }
});
</script>

</body>
</html>
